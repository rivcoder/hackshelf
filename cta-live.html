<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackshelf CTA Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Instrument+Sans:wght@600&display=swap">
<style>
/* Layout: a closing section that belongs to the Hackshelf page. Same wine-black ground, hairline rule on top, oxblood button, rose accent. The red glow rises from the base and fades out, so the section has no hard edges. Single dark look, chosen on purpose. */
:root {
  --bg: #170e0d;
  --ink: #f3e9e4;
  --hair: rgba(255, 235, 225, 0.1);
  --rose: #cd5a5e;
  --red-a: #b53c40;
  --red-b: #952f33;
  --display: "Cormorant Garamond", Georgia, serif;
  --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100vh;
  background: var(--bg); color: var(--ink); font: 14px/1.4 var(--text);
  overflow: hidden;
}

body {
  display: flex; flex-direction: column; align-items: stretch; justify-content: stretch;
}

.cta {
  position: relative; isolation: isolate; container-type: inline-size;
  border-top: 1px solid var(--hair);
  width: 100%; height: 100%; min-height: 100vh; margin: 0;
  display: flex; align-items: center; justify-content: center;
}

/* low red glow, fading into the page on every side */
.cta::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(56% 78% at 50% 112%, rgba(150, 38, 44, 0.62) 0%, rgba(150, 38, 44, 0) 100%),
    radial-gradient(34% 50% at 50% 100%, rgba(190, 62, 66, 0.22) 0%, rgba(190, 62, 66, 0) 100%);
}

.inner {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: clamp(28px, 4cqw, 48px); padding: clamp(40px, 8vw, 80px) 24px;
  max-width: 1120px; width: 100%; margin: 0 auto;
}

h1 {
  margin: 0; font: 500 clamp(34px, 5.9cqw, 68px) / 1.08 var(--display); letter-spacing: -0.005em;
  transition: opacity 0.7s ease, filter 0.7s ease;
}
h1.gone { opacity: 0; filter: blur(6px); }
.line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 0.2em; }
.w { display: inline-block; white-space: nowrap; }
.ch { position: relative; }
.ch.hide { opacity: 0; }
.ch.cur::after { content: ""; position: absolute; right: -0.07em; top: 0.14em; bottom: 0.08em; width: 0.04em; background: var(--rose); }
.acc { font-style: italic; color: var(--rose); }

/* same button as the hero's "Try it now" */
.btn {
  display: inline-block; text-decoration: none; cursor: pointer;
  background: linear-gradient(180deg, var(--red-a), var(--red-b)); color: #fbeee9;
  font: 600 18px / 1 var(--text); padding: 18px 36px; border-radius: 9999px;
  box-shadow: 0 10px 30px rgba(150, 38, 44, 0.35);
  transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}
.btn:hover { filter: brightness(1.1); box-shadow: 0 14px 38px rgba(170, 44, 50, 0.5); transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

@media (prefers-reduced-motion: no-preference) {
  .ch.cur::after { animation: blink 1s steps(1) infinite; }
  .btn { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both; }
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>

<section class="cta" aria-labelledby="cta-title">
  <div class="inner">
    <h1 id="cta-title" aria-label="Your next deadline is already out there.">
      <span class="line"><span class="w">Your</span><span class="w">next</span><span class="w">deadline</span></span>
      <span class="line"><span class="w">is</span><span class="w">already</span><span class="w acc">out</span><span class="w acc">there.</span></span>
    </h1>
    <a class="btn" href="app.html" target="_top">Try it now</a>
  </div>
</section>

<script>
/* Typewriter: types the headline, holds, fades it away, then types it again. Layout never jumps because hidden letters keep their space. */
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var h = document.querySelector('h1');
  if (!h) return;
  var words = h.querySelectorAll('.w'), chars = [], ends = {};
  words.forEach(function (w, wi) {
    var t = w.textContent; w.textContent = '';
    for (var k = 0; k < t.length; k++) {
      var s = document.createElement('span');
      s.className = 'ch hide'; s.textContent = t[k]; s.setAttribute('aria-hidden', 'true');
      w.appendChild(s); chars.push(s);
    }
    if (wi < words.length - 1) ends[chars.length - 1] = true;
  });
  var i = 0, cur = null;
  function type() {
    if (i >= chars.length) { setTimeout(vanish, 3200); return; }
    if (cur) cur.classList.remove('cur');
    chars[i].classList.remove('hide'); chars[i].classList.add('cur'); cur = chars[i];
    var d = 45 + Math.random() * 45; if (ends[i]) d += 240;
    i++; setTimeout(type, d);
  }
  function vanish() {
    h.classList.add('gone');
    setTimeout(function () {
      chars.forEach(function (c) { c.classList.add('hide'); c.classList.remove('cur'); });
      i = 0; cur = null; h.classList.remove('gone');
      setTimeout(type, 500);
    }, 900);
  }
  setTimeout(type, 500);
})();
</script>
</body>
</html>
